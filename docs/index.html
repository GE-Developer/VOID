<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID App – Legal</title>
<style>
    :root {
        color-scheme: light;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #111111;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 24px;
    }

    main {
        width: 100%;
        max-width: 720px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 48px;
        text-align: center;
    }

    .app-mark {
        margin: 0;
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        letter-spacing: 0.3em;
        text-transform: uppercase;
    }

    .link-grid {
        width: 100%;
        display: grid;
        gap: 24px;
    }

    @media (min-width: 560px) {
        .link-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    .link-grid a {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        padding: 18px 24px;
        border-radius: 999px;
        background: #111111;
        color: #ffffff;
        font-size: 1.1rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.18s ease, background 0.18s ease;
    }

    .link-grid a:hover,
    .link-grid a:focus-visible {
        background: #2b2b2b;
        transform: translateY(-2px);
    }

    .link-grid a:focus-visible {
        outline: 3px solid rgba(17, 17, 17, 0.3);
        outline-offset: 4px;
    }
</style>
</head>
<body>
<main>
    <p class="app-mark" aria-label="VOID">[VOID]</p>
    <div class="link-grid">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
    </div>
</main>
</body>
</html>
